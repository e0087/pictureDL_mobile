<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>コミックリーダー</title>
  <style>
    :root {
      color-scheme: dark;
      --reader-bg: #0b0d12;
      --reader-panel: #171b24;
      --reader-border: #303744;
      --reader-text: #f3f5f8;
      --reader-muted: #aab2c0;
      --reader-accent: #4da3ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--reader-text);
      background: radial-gradient(ellipse at top, #1c2431 0%, var(--reader-bg) 68%);
    }

    #archiveHome {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .archiveCard {
      width: min(100%, 460px);
      padding: 30px 26px;
      border: 1px solid var(--reader-border);
      border-radius: 20px;
      background: rgba(23, 27, 36, 0.96);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }

    .archiveEyebrow {
      margin: 0 0 8px;
      color: var(--reader-accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .archiveCard h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 34px);
      letter-spacing: 0.02em;
    }

    .archiveDescription {
      margin: 12px 0 26px;
      color: var(--reader-muted);
      line-height: 1.65;
    }

    .archiveLabel {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    #archiveFileInput {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 10px;
      border: 1px solid #424b5b;
      border-radius: 10px;
      color: var(--reader-text);
      background: #10141b;
    }

    #openArchiveBtn, #loadUrlComicBtn {
      width: 100%;
      min-height: 50px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      color: #061321;
      background: var(--reader-accent);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #openArchiveBtn:disabled, #loadUrlComicBtn:disabled {
      opacity: 0.6;
      cursor: wait;
    }


    .sourceTabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 24px;
      padding: 5px;
      border: 1px solid var(--reader-border);
      border-radius: 12px;
      background: #10141b;
    }

    .sourceTab {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      color: var(--reader-muted);
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .sourceTab[aria-selected="true"] {
      color: var(--reader-text);
      background: #303a49;
    }

    .sourcePanel[hidden] { display: none; }

    .sourcePanel label {
      display: block;
      margin: 14px 0 8px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
    }

    .sourcePanel input[type="url"],
    .sourcePanel input[type="text"] {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #424b5b;
      border-radius: 10px;
      color: var(--reader-text);
      background: #10141b;
      font: inherit;
    }

    .sourceHint {
      margin: 8px 0 0;
      color: var(--reader-muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
    }

    #errorContainer {
      min-height: 1.5em;
      margin-top: 16px;
      color: #ff9c9c;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #viewerOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 9999;
      touch-action: pan-y;
    }

    #viewerInner {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    #singleImage {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #spreadWrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #000;
      gap: 0;
    }

    #spreadWrapper .spreadSlot {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #spreadWrapper img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #spreadLeft { justify-content: flex-end; }
    #spreadRight { justify-content: flex-start; }

    .viewerControls {
      position: fixed;
      left: 0;
      bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 10000;
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .viewerNavButtons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    #pageSlider {
      box-sizing: border-box;
      width: 100vw;
      max-width: none;
      height: 24px;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }

    #pageSlider::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.55);
    }

    #pageSlider::-webkit-slider-thumb {
      width: 16px;
      height: 16px;
      margin-top: -6px;
      border: 0;
      border-radius: 50%;
      background: var(--reader-accent);
      -webkit-appearance: none;
    }

    #pageSlider::-moz-range-track {
      height: 4px;
      background: rgba(255, 255, 255, 0.55);
    }

    #pageSlider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 0;
      border-radius: 50%;
      background: var(--reader-accent);
    }

    #readerLoadingStatus {
      position: fixed;
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(44px + env(safe-area-inset-bottom));
      z-index: 10002;
      display: flex;
      min-width: 40px;
      min-height: 40px;
      max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      color: #fff;
      background: rgba(25, 29, 37, 0.9);
      font-size: 16px;
      line-height: 18px;
      pointer-events: none;
      white-space: nowrap;
    }

    #readerLoadingStatus[hidden],
    #viewerOverlay.viewer-ui-hidden #readerLoadingStatus { display: none; }

    #viewerOverlay.viewer-ui-hidden .viewerControls { display: none; }

    .viewerBtn, .fixedBtn {
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      color: #fff;
      background: rgba(25, 29, 37, 0.9);
      font-size: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .viewerBtn { padding: 10px 16px; }

    .fixedBtn {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      z-index: 10001;
      padding: 10px 14px;
      background: rgba(25, 29, 37, 0.78);
    }

    .menuBtn { left: calc(12px + env(safe-area-inset-left)); }
    .closeBtn { right: calc(12px + env(safe-area-inset-right)); }

    .PageIndicator {
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    #menuPanel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(360px, calc(100vw - 32px));
      padding: 18px;
      border: 1px solid #414958;
      border-radius: 14px;
      color: #fff;
      background: rgba(24, 28, 36, 0.97);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65);
      display: none;
      z-index: 11000;
    }

    #menuPanel h3 { margin: 0 0 14px; font-size: 17px; }

    .menuRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0;
      gap: 8px;
    }


    .menuField {
      margin: 14px 0;
      text-align: left;
    }

    .menuField label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .menuField input {
      width: 100%;
      min-height: 40px;
      padding: 9px 10px;
      border: 1px solid #465061;
      border-radius: 8px;
      color: var(--reader-text);
      background: #10141b;
      font: inherit;
    }

    .menuFooter {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .menuFooter .viewerBtn { min-width: 92px; }

    .chip {
      padding: 7px 9px;
      border: 1px solid #465061;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 13px;
      white-space: nowrap;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      margin-left: 8px;
      vertical-align: middle;
      flex: 0 0 auto;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 13px;
      background-color: #555e6b;
      cursor: pointer;
      transition: background-color .2s;
    }

    .slider::before {
      position: absolute;
      left: 2px;
      bottom: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      content: "";
      transition: transform .2s;
    }

    .switch input:checked + .slider { background-color: var(--reader-accent); }
    .switch input:checked + .slider::before { transform: translateX(24px); }

    #panoramaWrapper {
      display: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      background: #000;
      scrollbar-width: none;
    }

    #panoramaWrapper::-webkit-scrollbar { display: none; }

    #panoramaWrapper img {
      display: inline-block;
      width: auto;
      height: 100%;
      object-fit: contain;
      vertical-align: middle;
      margin: 0;
      padding: 0;
    }

    @media (max-aspect-ratio: 3/4) {
      #spreadWrapper img { width: auto; height: 100%; }
    }

    @media (max-width: 600px) {
      #archiveHome { padding: 18px; }
      .archiveCard { padding: 26px 20px; }
      .viewerControls { bottom: 12px; }
      #menuPanel { width: min(360px, calc(100vw - 24px)); }
    }
  </style>
</head>

<body>
  <main id="archiveHome">
    <section class="archiveCard" aria-labelledby="appTitle">
      <p class="archiveEyebrow">COMIC READER</p>
      <h1 id="appTitle">コミックリーダー</h1>
      <p class="archiveDescription">読み込み方法を選んで、コミックを開きます。</p>
      <div class="sourceTabs" role="tablist" aria-label="読み込み方法">
        <button class="sourceTab" id="archiveModeTab" type="button" role="tab" aria-selected="true" aria-controls="archiveSourcePanel">書庫ファイル</button>
        <button class="sourceTab" id="urlModeTab" type="button" role="tab" aria-selected="false" aria-controls="urlSourcePanel">画像URL</button>
      </div>
      <section class="sourcePanel" id="archiveSourcePanel" role="tabpanel" aria-labelledby="archiveModeTab">
        <label class="archiveLabel" for="archiveFileInput">ZIP / RAR ファイル</label>
        <input type="file" id="archiveFileInput" accept=".zip,.rar,application/zip,application/vnd.rar">
        <button id="openArchiveBtn" type="button">読み込んで読む</button>
      </section>
      <section class="sourcePanel" id="urlSourcePanel" role="tabpanel" aria-labelledby="urlModeTab" hidden>
        <label for="textInput">1枚目の画像URL または画像ページURL</label>
        <input type="url" id="textInput" inputmode="url" placeholder="https://example.com/page001.jpg" autocomplete="url">
        <p class="sourceHint">画像URLに連番が含まれる場合、後続ページを探して読み込みます。</p>
        <label for="zipFileNameInput">タイトル / ZIPファイル名（任意）</label>
        <input type="text" id="zipFileNameInput" placeholder="作品名" autocomplete="off">
        <button id="loadUrlComicBtn" type="button">読み込んで読む</button>
      </section>
      <div id="errorContainer" role="status" aria-live="polite"></div>
    </section>
  </main>

  <!-- Viewer overlay -->
  <div id="viewerOverlay" aria-hidden="true">
    <div id="viewerInner">
      <!-- Single image container -->
      <img id="singleImage" alt="viewer" style="display:none">
      <!-- Spread container: left/right slots -->
      <div id="spreadWrapper" style="display:none">
        <div class="spreadSlot" id="spreadLeft"><img id="spreadLeftImg" alt=""></div>
        <div class="spreadSlot" id="spreadRight"><img id="spreadRightImg" alt=""></div>
      </div>
    </div>

    <div id="readerLoadingStatus" aria-live="polite" hidden></div>
    <div class="viewerControls">
      <button id="menuBtn" class="fixedBtn menuBtn">≡</button>
      <div id="pageIndicator" class="fixedBtn PageIndicator">1</div>
      <button id="closeBtn" class="fixedBtn closeBtn">✕</button>
      <div class="viewerNavButtons">
        <button class="viewerBtn" id="prevBtn" type="button">◀</button>
        <button class="viewerBtn" id="firstBtn" type="button">1ページ目</button>
        <button class="viewerBtn" id="nextBtn" type="button">▶</button>
      </div>
      <input id="pageSlider" type="range" min="0" max="0" value="0" aria-label="表示ページ">
    </div>
  </div>

  <!-- Menu panel (modal) -->
  <div id="menuPanel" role="dialog" aria-modal="true" aria-hidden="true">
    <h3>リーダー設定</h3>
    <div class="menuRow">
      <div>見開きモード</div>
      <label class="switch"><input type="checkbox" id="spreadSwitch"><span class="slider"></span></label>
    </div>
    <div class="menuRow">
      <div>パノラマモード</div>
      <label class="switch"><input type="checkbox" id="panoramaSwitch"><span class="slider"></span></label>
    </div>
    <div class="menuRow">
      <div>開き方向</div>
      <div>
        <label class="chip"><input type="radio" name="openDir" value="right" id="dirRight" checked> 右開き</label>
        <label class="chip" style="margin-left:6px"><input type="radio" name="openDir" value="left" id="dirLeft">
          左開き</label>
      </div>
    </div>
    <div class="menuRow">
      <div>ページずらし</div>
      <label class="switch"><input type="checkbox" id="shiftSwitch"><span class="slider"></span></label>
    </div>
    <div class="menuField" id="urlZipNameSetting" hidden>
      <label for="readerZipFileNameInput">タイトル / ZIPファイル名（任意）</label>
      <input type="text" id="readerZipFileNameInput" placeholder="作品名" autocomplete="off">
    </div>
    <div class="menuFooter">
      <button class="viewerBtn" id="menuDownloadBtn" type="button" style="display:none">ZIP保存</button>
      <button class="viewerBtn" id="menuCloseBtn" type="button">閉じる</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>
  <script type="module">
    window.extractRarImages = async function (file) {
      const moduleUrl = 'https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/index.js';
      const wasmUrl = 'https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/js/unrar.wasm';
      const [{ createExtractorFromData }, wasmBinary, data] = await Promise.all([
        import(moduleUrl),
        fetch(wasmUrl).then(response => {
          if (!response.ok) throw new Error('RAR展開モジュールを取得できませんでした。');
          return response.arrayBuffer();
        }),
        file.arrayBuffer()
      ]);
      const extractor = await createExtractorFromData({ data, wasmBinary });
      const { files } = extractor.extract();
      const entries = [];
      for (const item of files) {
        const name = item.fileHeader.name;
        if (!item.fileHeader.flags.directory && item.extraction && /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(name)) {
          entries.push({ name, data: item.extraction });
        }
      }
      return entries;
    };
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // --- ローカルの ZIP / RAR から画像を読み込む ---
      const archiveFileInput = document.getElementById('archiveFileInput');
      const openArchiveBtn = document.getElementById('openArchiveBtn');
      const urlInput = document.getElementById('textInput');
      const urlTitleInput = document.getElementById('zipFileNameInput');
      const readerZipNameSetting = document.getElementById('urlZipNameSetting');
      const readerZipNameInput = document.getElementById('readerZipFileNameInput');
      const loadUrlComicBtn = document.getElementById('loadUrlComicBtn');
      const menuDownloadBtn = document.getElementById('menuDownloadBtn');
      const archiveModeTab = document.getElementById('archiveModeTab');
      const urlModeTab = document.getElementById('urlModeTab');
      const archiveSourcePanel = document.getElementById('archiveSourcePanel');
      const urlSourcePanel = document.getElementById('urlSourcePanel');
      let activeSource = 'archive';
      let urlComicTitle = '';
      let loadedComic = null;
      let urlComicLoading = false;
      let pendingUrlNext = 0;
      let archiveObjectUrls = [];
      let activeArchiveProgressKey = null;
      let activeArchiveProgressName = '';
      let activeArchivePageNames = [];
      const archiveProgressStoragePrefix = 'pictureDL:reading-position:v3:';

      function setSourceMode(mode) {
        activeSource = mode;
        const showArchive = mode === 'archive';
        archiveModeTab.setAttribute('aria-selected', String(showArchive));
        urlModeTab.setAttribute('aria-selected', String(!showArchive));
        archiveSourcePanel.hidden = !showArchive;
        urlSourcePanel.hidden = showArchive;
        document.getElementById('errorContainer').textContent = '';
        updateSourceButtonLabels();
      }

      archiveModeTab.addEventListener('click', () => setSourceMode('archive'));
      urlModeTab.addEventListener('click', () => setSourceMode('url'));

      function setSourceLoading(isLoading) {
        archiveModeTab.disabled = isLoading;
        urlModeTab.disabled = isLoading;
        openArchiveBtn.disabled = isLoading;
        loadUrlComicBtn.disabled = isLoading;
      }

      function showReaderStatus(message) {
        const status = document.getElementById('readerLoadingStatus');
        status.textContent = message;
        status.hidden = false;
      }

      function hideReaderStatus() {
        const status = document.getElementById('readerLoadingStatus');
        status.hidden = true;
      }

      function isSameLoadedArchive(file) {
        return loadedComic && loadedComic.source === 'archive'
          && isSameArchiveName(loadedComic.fileName, file.name)
          && loadedComic.fileSize === file.size
          && loadedComic.lastModified === file.lastModified;
      }

      function canReuseLoadedArchive(file) {
        return loadedComic && loadedComic.source === 'archive' && images.length
          && (!file || isSameLoadedArchive(file));
      }

      function updateSourceButtonLabels() {
        const file = archiveFileInput.files && archiveFileInput.files[0];
        openArchiveBtn.textContent = canReuseLoadedArchive(file) ? '読む' : '読み込んで読む';
        const canReopenUrl = loadedComic && loadedComic.source === 'url'
          && urlInput.value.trim() === loadedComic.inputUrl;
        loadUrlComicBtn.textContent = canReopenUrl ? '読む' : '読み込んで読む';
        if (urlComicLoading) loadUrlComicBtn.disabled = !canReopenUrl;
      }

      archiveFileInput.addEventListener('change', updateSourceButtonLabels);
      urlInput.addEventListener('input', updateSourceButtonLabels);

      function syncUrlTitleInputs(value) {
        urlTitleInput.value = value;
        readerZipNameInput.value = value;
        if (activeSource === 'url') urlComicTitle = value.trim();
      }

      urlTitleInput.addEventListener('input', function () {
        syncUrlTitleInputs(urlTitleInput.value);
      });
      readerZipNameInput.addEventListener('input', function () {
        syncUrlTitleInputs(readerZipNameInput.value);
      });

      function getArchiveProgressKey(fileName) {
        const normalizedName = fileName
          .normalize('NFKC')
          .toLocaleLowerCase('ja-JP')
          .replace(/\.(zip|rar)$/i, '')
          .replace(/\d+(?=\D*$)/, '{volume}');
        return archiveProgressStoragePrefix + normalizedName;
      }

      function readArchiveProgress(key) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : null;
        } catch (error) {
          console.warn('読書位置を読み込めませんでした:', error);
          return null;
        }
      }

      function isSameArchiveName(nameA, nameB) {
        return typeof nameA === 'string' && typeof nameB === 'string'
          && nameA.normalize('NFKC').toLocaleLowerCase('ja-JP')
            === nameB.normalize('NFKC').toLocaleLowerCase('ja-JP');
      }

      function hasSavedMidProgress(progress) {
        const page = Number(progress && progress.page);
        const maxPage = Number(progress && progress.maxPage);
        return Number.isInteger(page) && Number.isInteger(maxPage)
          && page > 1 && page < maxPage;
      }

      function saveArchiveProgress() {
        if (!activeArchiveProgressKey || !images.length) return;

        const maxPage = images.length;
        const currentPage = Math.max(1, Math.min(maxPage, idx + 1));
        const lastVisibleIndex = spreadSwitch.checked && !panoramaSwitch.checked
          ? Math.min(maxPage - 1, getSpreadPairStart(idx) + 1)
          : idx;

        try {
          // 先頭または最後の見開きまで読んだ状態は保存せず、既存記録も削除する
          if (currentPage === 1 || lastVisibleIndex >= maxPage - 1) {
            localStorage.removeItem(activeArchiveProgressKey);
            return;
          }

          localStorage.setItem(activeArchiveProgressKey, JSON.stringify({
            archiveName: activeArchiveProgressName,
            page: currentPage,
            maxPage: maxPage,
            pageName: activeArchivePageNames[idx] || '',
            updatedAt: Date.now()
          }));
        } catch (error) {
          console.warn('読書位置を保存できませんでした:', error);
        }
      }

      function releaseArchiveObjectUrls() {
        archiveObjectUrls.forEach(url => URL.revokeObjectURL(url));
        archiveObjectUrls = [];
      }
      const archiveImageExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp', '.avif'];
      const archiveFileCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

      function isArchiveImage(path) {
        return archiveImageExtensions.some(ext => path.toLowerCase().endsWith(ext));
      }

      function imageMimeType(path) {
        const ext = path.toLowerCase().slice(path.lastIndexOf('.'));
        return ({ '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.png': 'image/png', '.webp': 'image/webp', '.gif': 'image/gif', '.bmp': 'image/bmp', '.avif': 'image/avif' })[ext] || 'application/octet-stream';
      }

      function renderArchiveImages(entries, archiveFile) {
        if (!entries.length) throw new Error('書庫内に画像ファイルが見つかりませんでした。');
        entries.sort((a, b) => archiveFileCollator.compare(a.name, b.name));
        const archiveName = archiveFile.name;

        activeSource = 'archive';
        menuDownloadBtn.style.display = 'none';
        activeArchiveProgressKey = getArchiveProgressKey(archiveName);
        activeArchiveProgressName = archiveName;
        activeArchivePageNames = entries.map(entry => entry.name);
        const savedProgress = readArchiveProgress(activeArchiveProgressKey);
        const isSameArchiveFile = savedProgress
          && isSameArchiveName(savedProgress.archiveName, archiveName);
        const savedPageNameIndex = isSameArchiveFile && savedProgress.pageName
          ? activeArchivePageNames.indexOf(savedProgress.pageName)
          : -1;
        const savedPageIndex = isSameArchiveFile
          ? (savedPageNameIndex >= 0
            ? savedPageNameIndex
            : Number(savedProgress.page) - 1)
          : 0;
        idx = Number.isFinite(savedPageIndex)
          ? Math.max(0, Math.min(entries.length - 1, savedPageIndex))
          : 0;

        releaseArchiveObjectUrls();
        images = entries.map(entry => {
          const url = URL.createObjectURL(new Blob([entry.data], { type: imageMimeType(entry.name) }));
          archiveObjectUrls.push(url);
          return url;
        });
        loadedComic = {
          source: 'archive',
          fileName: archiveFile.name,
          fileSize: archiveFile.size,
          lastModified: archiveFile.lastModified
        };
        updateSourceButtonLabels();
        document.getElementById('errorContainer').textContent = `${archiveName} から画像を ${entries.length} 枚読み込みました。`;
        openViewer();
      }

      async function openZipArchive(file) {
        const zip = await JSZip.loadAsync(file);
        const imageFiles = Object.values(zip.files)
          .filter(entry => !entry.dir && isArchiveImage(entry.name))
          .sort((a, b) => archiveFileCollator.compare(a.name, b.name));
        const entries = await Promise.all(imageFiles.map(async entry => ({
          name: entry.name,
          data: await entry.async('uint8array')
        })));
        renderArchiveImages(entries, file);
      }

      async function openRarArchive(file) {
        if (!window.extractRarImages) throw new Error('RAR読み込みライブラリを読み込めませんでした。ネットワーク接続を確認してください。');
        const entries = await window.extractRarImages(file);
        renderArchiveImages(entries, file);
      }

      function isDirectImageUrl(value) {
        try {
          return /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(new URL(value).pathname);
        } catch (error) {
          return false;
        }
      }

      async function extractImageUrlFromPage(pageUrl) {
        let page;
        try {
          page = new URL(pageUrl);
        } catch (error) {
          throw new Error('正しい画像URLまたは画像ページURLを入力してください。');
        }
        if (page.protocol !== 'https:' && page.protocol !== 'http:') {
          throw new Error('http または https のURLを入力してください。');
        }

        let response;
        try {
          response = await fetch(page.href);
        } catch (error) {
          throw new Error('ページを取得できませんでした。CORS設定や通信制限を確認してください。');
        }
        if (!response.ok) throw new Error(`ページ取得失敗: HTTP ${response.status}`);

        const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
        const container = doc.querySelector('section#image-container');
        if (!container) throw new Error('ページ内に画像一覧が見つかりません。');
        const image = Array.from(container.querySelectorAll('img[src], img[data-src]')).find(element =>
          element.getAttribute('src') || element.getAttribute('data-src')
        );
        if (!image) throw new Error('ページ内に画像が見つかりません。');
        const imageUrl = new URL(image.getAttribute('src') || image.getAttribute('data-src'), page.href);
        if (!isDirectImageUrl(imageUrl.href)) throw new Error('対応していない画像形式です。');
        return imageUrl;
      }

      function probeImage(url) {
        return new Promise(resolve => {
          const image = new Image();
          image.onload = () => resolve(true);
          image.onerror = () => resolve(false);
          image.src = url.href;
        });
      }

      async function loadUrlComicImages(inputUrl, onImageFound) {
        const firstImageUrl = isDirectImageUrl(inputUrl)
          ? new URL(inputUrl)
          : await extractImageUrlFromPage(inputUrl);
        const pathMatch = firstImageUrl.pathname.match(/^(.*?)(\d+)(\.[^./]+)$/);
        if (!pathMatch) {
          if (!(await probeImage(firstImageUrl))) throw new Error('指定された画像を読み込めませんでした。');
          await onImageFound(firstImageUrl.href, 1);
          return 1;
        }

        const [, prefix, initialDigits, originalExtension] = pathMatch;
        const firstNumber = Number(initialDigits);
        const legacyExtensions = ['.jpg', '.png', '.jpeg', '.webp'];
        const isLegacyExtension = legacyExtensions.includes(originalExtension.toLowerCase());
        const extensions = isLegacyExtension
          ? [originalExtension, ...legacyExtensions.filter(extension => extension !== originalExtension.toLowerCase())]
          : [originalExtension];
        let loadedCount = 0;
        let consecutiveMisses = 0;
        const maxConsecutiveMisses = 4;
        const maxPages = 5000;

        for (let offset = 0; offset < maxPages && consecutiveMisses < maxConsecutiveMisses; offset++) {
          const number = String(firstNumber + offset).padStart(initialDigits.length, '0');
          let foundUrl = null;
          for (const extension of extensions) {
            const candidate = new URL(firstImageUrl.href);
            candidate.pathname = `${prefix}${number}${extension}`;
            if (await probeImage(candidate)) {
              foundUrl = candidate.href;
              break;
            }
          }

          if (foundUrl) {
            consecutiveMisses = 0;
            loadedCount++;
            await onImageFound(foundUrl, loadedCount);
          } else {
            consecutiveMisses++;
          }
        }

        if (!loadedCount) throw new Error('連番画像を読み込めませんでした。');
        return loadedCount;
      }

      loadUrlComicBtn.addEventListener('click', async function () {
        const inputUrl = urlInput.value.trim();
        if (!inputUrl) {
          document.getElementById('errorContainer').textContent = '画像URLを入力してください。';
          return;
        }

        if (loadedComic && loadedComic.source === 'url'
          && inputUrl === loadedComic.inputUrl && images.length) {
          urlComicTitle = urlTitleInput.value.trim();
          openViewer();
          return;
        }

        setSourceLoading(true);
        urlComicLoading = true;
        pendingUrlNext = 0;
        document.getElementById('errorContainer').textContent = '画像URLを確認しています...';
        showReaderStatus('画像読込中...');
        let readerOpened = false;
        try {
          await loadUrlComicImages(inputUrl, function (imageUrl, loadedCount) {
            if (!readerOpened) {
              releaseArchiveObjectUrls();
              activeArchiveProgressKey = null;
              activeArchiveProgressName = '';
              activeArchivePageNames = [];
              activeSource = 'url';
              urlComicTitle = urlTitleInput.value.trim();
              loadedComic = { source: 'url', inputUrl };
              menuDownloadBtn.style.display = 'inline-block';
              menuDownloadBtn.disabled = true;
              menuDownloadBtn.textContent = '読み込み中...';
              images = [];
              idx = 0;
              readerOpened = true;
              updateSourceButtonLabels();
            }

            images.push(imageUrl);
            document.getElementById('errorContainer').textContent = `画像を読み込み中... ${loadedCount} 枚`;
            showReaderStatus(`画像読込 ${loadedCount}枚`);
            if (loadedCount === 1) {
              openViewer();
            } else if (viewerOverlay.getAttribute('aria-hidden') !== 'true') {
              renderViewer(false);
              drainPendingUrlNext();
            }
          });
          urlComicLoading = false;
          pendingUrlNext = 0;
          document.getElementById('errorContainer').textContent = `${urlComicTitle || 'URL画像'} を ${images.length} 枚読み込みました。`;
          menuDownloadBtn.disabled = false;
          menuDownloadBtn.textContent = 'ZIP保存';
        } catch (error) {
          urlComicLoading = false;
          pendingUrlNext = 0;
          console.error('URL画像の読み込みエラー:', error);
          document.getElementById('errorContainer').textContent = error.message || '画像を読み込めませんでした。';
        } finally {
          urlComicLoading = false;
          pendingUrlNext = 0;
          hideReaderStatus();
          if (readerOpened) {
            menuDownloadBtn.disabled = false;
            menuDownloadBtn.textContent = 'ZIP保存';
          }
          setSourceLoading(false);
          updateSourceButtonLabels();
        }
      });

      openArchiveBtn.addEventListener('click', async function () {
        const file = archiveFileInput.files && archiveFileInput.files[0];
        if (canReuseLoadedArchive(file)) {
          activeSource = 'archive';
          openViewer();
          return;
        }
        if (!file) {
          document.getElementById('errorContainer').textContent = 'ZIP または RAR ファイルを選択してください。';
          return;
        }

        const isSupportedArchive = /\.(zip|rar)$/i.test(file.name);
        if (isSupportedArchive) {
          const savedProgress = readArchiveProgress(getArchiveProgressKey(file.name));
          const isDifferentVolume = savedProgress
            && !isSameArchiveName(savedProgress.archiveName, file.name);
          if (isDifferentVolume && hasSavedMidProgress(savedProgress)) {
            const message = `${savedProgress.archiveName} を ${savedProgress.page}/${savedProgress.maxPage} ページまで読んだ記録があります。\n別巻「${file.name}」を開きますか？`;
            if (!window.confirm(message)) return;
          }
        }

        setSourceLoading(true);
        document.getElementById('errorContainer').textContent = '書庫を展開しています...';
        try {
          if (/\.zip$/i.test(file.name)) await openZipArchive(file);
          else if (/\.rar$/i.test(file.name)) await openRarArchive(file);
          else throw new Error('対応している形式は ZIP と RAR です。');
        } catch (error) {
          console.error('書庫の読み込みエラー:', error);
          document.getElementById('errorContainer').textContent = '書庫を開けませんでした: ' + (error.message || 'ファイル形式または内容を確認してください。');
        } finally {
          setSourceLoading(false);
        }
      });
      // viewer elements
      const viewerOverlay = document.getElementById('viewerOverlay');
      const singleImage = document.getElementById('singleImage');
      const spreadWrapper = document.getElementById('spreadWrapper');
      const spreadLeftImg = document.getElementById('spreadLeftImg');
      const spreadRightImg = document.getElementById('spreadRightImg');
      const spreadSwitch = document.getElementById('spreadSwitch');
      const dirRight = document.getElementById('dirRight');
      const dirLeft = document.getElementById('dirLeft');
      const menuBtn = document.getElementById('menuBtn');
      const menuPanel = document.getElementById('menuPanel');
      const menuCloseBtn = document.getElementById('menuCloseBtn');
      const firstBtn = document.getElementById('firstBtn');
      const pageSlider = document.getElementById('pageSlider');
      const shiftSwitch = document.getElementById('shiftSwitch');
      const panoramaSwitch = document.getElementById('panoramaSwitch');
      const panoramaWrapper = document.createElement('div');
      panoramaWrapper.id = 'panoramaWrapper';
      document.getElementById('viewerInner').appendChild(panoramaWrapper);
      let isProgrammaticScroll = false;
      let isPanoramaResizing = false;
      let panoramaResizeRestoreIndex = null;
      let panoramaResizeTimeout = null;
      let panoramaScrollTimeout = null;
      let panoramaProgrammaticUnlockTimer = null;
      panoramaWrapper.addEventListener('scroll', function () {
        if (!panoramaSwitch.checked || isPanoramaResizing) return;
        if (isProgrammaticScroll) {
          if (panoramaProgrammaticUnlockTimer) clearTimeout(panoramaProgrammaticUnlockTimer);
          panoramaProgrammaticUnlockTimer = setTimeout(function () {
            isProgrammaticScroll = false;
            panoramaProgrammaticUnlockTimer = null;
          }, 160);
          return;
        }
        if (panoramaScrollTimeout) clearTimeout(panoramaScrollTimeout);
        panoramaScrollTimeout = setTimeout(function () {
          if (isProgrammaticScroll || isPanoramaResizing) return;
          const imgs = Array.from(panoramaWrapper.querySelectorAll('img'));
          if (!imgs.length) return;
          const wrapperRect = panoramaWrapper.getBoundingClientRect();
          const wrapperCenterX = wrapperRect.left + wrapperRect.width / 2;
          let closestIndex = 0;
          let closestDist = Infinity;
          imgs.forEach(img => {
            const rect = img.getBoundingClientRect();
            const imgCenter = rect.left + rect.width / 2;
            const dist = Math.abs(imgCenter - wrapperCenterX);
            const index = parseInt(img.dataset.index, 10);
            if (dist < closestDist) {
              closestDist = dist;
              closestIndex = index;
            }
          });
          if (idx !== closestIndex) {
            idx = closestIndex;
            updatePageIndicator();
          }
        }, 80);
      }, { passive: true });

      // --- ビューア全体の三分割タップ制御 ---
      viewerOverlay.addEventListener('click', function (e) {
        // 操作ボタン上のタップはページ操作に使わない
        if (e.target.closest('.viewerControls')) return;

        const rect = viewerOverlay.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const third = rect.width / 3;

        // 中央領域をタップするとビューアの操作UIを切り替える
        if (x >= third && x <= third * 2) {
          if (viewerOverlay.classList.contains('viewer-ui-hidden')) {
            viewerOverlay.classList.remove('viewer-ui-hidden');
          } else {
            closeMenu();
            viewerOverlay.classList.add('viewer-ui-hidden');
          }
          return;
        }

        // 左右どちらをタップしたかで動作を決定
        if (dirRight.checked) {
          // 右開き → 左領域で進む、右領域で戻る
          if (x < third) next();
          else prev();
        } else {
          // 左開き → 右領域で進む、左領域で戻る
          if (x > third * 2) next();
          else prev();
        }
      });

      let images = []; // list of image URLs
      let idx = 0;
      let pageSliderInteracting = false;

      function preservePanoramaPageDuringResize() {
        if (!panoramaSwitch.checked || viewerOverlay.getAttribute('aria-hidden') === 'true') return;
        if (panoramaResizeRestoreIndex === null) panoramaResizeRestoreIndex = idx;
        isPanoramaResizing = true;
        if (panoramaScrollTimeout) {
          clearTimeout(panoramaScrollTimeout);
          panoramaScrollTimeout = null;
        }
        if (panoramaResizeTimeout) clearTimeout(panoramaResizeTimeout);
        panoramaResizeTimeout = setTimeout(function () {
          const restoreIndex = panoramaResizeRestoreIndex;
          panoramaResizeRestoreIndex = null;
          panoramaResizeTimeout = null;
          isPanoramaResizing = false;
          if (restoreIndex === null || !panoramaSwitch.checked || !images.length) return;

          idx = Math.max(0, Math.min(images.length - 1, restoreIndex));
          updatePageIndicator();
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              scrollToPanoramaIndex(idx, 'auto');
            });
          });
        }, 250);
      }

      window.addEventListener('resize', preservePanoramaPageDuringResize);
      window.addEventListener('orientationchange', preservePanoramaPageDuringResize);

      function ensurePanoramaDOM() {
        const existing = Array.from(panoramaWrapper.querySelectorAll('img'));
        const sharedLength = Math.min(existing.length, images.length);

        for (let i = 0; i < sharedLength; i++) {
          if (existing[i].src !== images[i]) existing[i].src = images[i];
          existing[i].dataset.index = i;
        }

        for (let i = existing.length - 1; i >= images.length; i--) {
          existing[i].remove();
        }

        for (let i = existing.length; i < images.length; i++) {
          const img = document.createElement('img');
          img.dataset.index = i;
          img.src = images[i];
          img.alt = 'p' + (i + 1);
          panoramaWrapper.appendChild(img);
        }
      }

      function getSpreadPairStart(pageIndex) {
        if (shiftSwitch.checked) return Math.floor(pageIndex / 2) * 2;
        if (pageIndex === 0) return 0; // 表紙は単独表示
        return Math.floor((pageIndex - 1) / 2) * 2 + 1;
      }

      function updatePageIndicator(saveProgress = true) {
        const indicator = document.getElementById('pageIndicator');
        if (!indicator) return;

        const spreadOn = spreadSwitch.checked;
        const panoOn = panoramaSwitch.checked;
        let text = '';

        if (panoOn) {
          text = (idx + 1).toString();
        } else if (spreadOn) {
          if (!shiftSwitch.checked && idx === 0) {
            text = '1';
          } else {
            const pairStart = getSpreadPairStart(idx);
            const p1 = pairStart + 1;
            const p2 = pairStart + 2;
            if (p1 > images.length) {
              text = "";
            } else if (p2 > images.length) {
              text = p1.toString();
            } else {
              text = `${p1} - ${p2}`;
            }
          }
        } else {
          text = (idx + 1).toString();
        }
        document.getElementById('pageIndicator').textContent = text;
        pageSlider.max = String(Math.max(0, images.length - 1));
        if (!pageSliderInteracting) {
          pageSlider.value = String(images.length ? Math.max(0, Math.min(images.length - 1, idx)) : 0);
        }
        pageSlider.style.direction = dirRight.checked ? 'rtl' : 'ltr';
        if (saveProgress) saveArchiveProgress();
      }

      // Viewer behaviours
      function openViewer() { if (!images.length) return; viewerOverlay.classList.remove('viewer-ui-hidden'); viewerOverlay.style.display = 'flex'; viewerOverlay.setAttribute('aria-hidden', 'false'); renderViewer(); }
      function closeViewer() { viewerOverlay.classList.remove('viewer-ui-hidden'); viewerOverlay.style.display = 'none'; viewerOverlay.setAttribute('aria-hidden', 'true'); closeMenu(); }
      function renderViewer(saveProgress = true) {
        const spreadOn = spreadSwitch.checked;
        const panoOn = panoramaSwitch.checked;

        if (panoOn) {
          singleImage.style.display = 'none';
          spreadWrapper.style.display = 'none';

          // まずパノラマDOMを確実に作る（初回のみ）
          ensurePanoramaDOM();

          // 表示切替
          panoramaWrapper.style.display = 'flex';

          // 現在のインデックスを保持したまま開き方向を切り替える
          // （dirRight が true のとき row-reverse、false のとき row としている色々なロジックに合わせてください）
          const newDir = dirRight.checked ? 'row-reverse' : 'row';
          // 変更が実際に起きるときだけ処理（無駄な再flowを避ける）
          if (panoramaWrapper.style.flexDirection !== newDir) {
            const currentIdx = Math.max(0, Math.min(images.length - 1, idx));
            panoramaWrapper.style.flexDirection = newDir;
            setTimeout(() => scrollToPanoramaIndex(currentIdx, 'auto'), 20);
          } else {
            // flexDirection が変わらない場合は何もしない（DOM再構築もしない）
            // ただし初回表示などで idx を画面に合わせたい場合は必要に応じてスクロールする
            const target = panoramaWrapper.querySelector(`img[data-index="${idx}"]`);
            if (target) {
              // （初回表示で画面に合わせたいならコメント解除）
              // target.scrollIntoView({ behavior: "auto", inline: "center" });
            }
          }

        } else if (spreadOn) {
          panoramaWrapper.style.display = 'none';
          singleImage.style.display = 'none';
          spreadWrapper.style.display = 'flex';

          const dir = dirRight.checked ? 'right' : 'left';

          let leftIndex = -1, rightIndex = -1;
          if (!shiftSwitch.checked && idx === 0) {
            // 表紙は開き方向に応じた外側のページ位置へ単独で置く
            if (dir === 'left') leftIndex = 0;
            else rightIndex = 0;
          } else {
            const pairStart = getSpreadPairStart(idx);
            if (dir === 'left') {
              leftIndex = pairStart;
              rightIndex = pairStart + 1;
            } else {
              leftIndex = pairStart + 1;
              rightIndex = pairStart;
            }
          }

          spreadLeftImg.src = images[leftIndex] || '';
          spreadRightImg.src = images[rightIndex] || '';
          spreadLeftImg.style.visibility = leftIndex >= 0 && images[leftIndex] ? 'visible' : 'hidden';
          spreadRightImg.style.visibility = rightIndex >= 0 && images[rightIndex] ? 'visible' : 'hidden';

        } else {
          panoramaWrapper.style.display = 'none';
          spreadWrapper.style.display = 'none';
          singleImage.style.display = 'block';
          singleImage.src = images[idx] || '';
        }

        // ページインジケーター更新
        updatePageIndicator(saveProgress);
      }

      function canAdvanceNext() {
        if (!images.length) return false;
        if (panoramaSwitch.checked || !spreadSwitch.checked) return idx < images.length - 1;
        const nextIndex = !shiftSwitch.checked && idx === 0 ? 1 : idx + 2;
        return nextIndex < images.length;
      }

      function drainPendingUrlNext() {
        while (pendingUrlNext > 0 && canAdvanceNext()) {
          pendingUrlNext--;
          next();
        }
      }

      function next() {
        const spreadOn = spreadSwitch.checked;
        const panoOn = panoramaSwitch.checked;

        if (!canAdvanceNext()) {
          if (urlComicLoading) pendingUrlNext = Math.min(pendingUrlNext + 1, 50);
          return;
        }

        if (panoOn) {
          if (idx < images.length - 1) {
            idx++;
            scrollToPanoramaIndex(idx, 'smooth');
          }
          updatePageIndicator();
        } else if (spreadOn) {
          const nextIndex = !shiftSwitch.checked && idx === 0 ? 1 : idx + 2;
          if (nextIndex < images.length) idx = nextIndex;
          renderViewer();
        } else {
          if (idx < images.length - 1) {
            idx++;
            renderViewer();
          }
        }
      }

      function prev() {
        const spreadOn = spreadSwitch.checked;
        const panoOn = panoramaSwitch.checked;

        if (panoOn) {
          if (idx > 0) {
            idx--;
            scrollToPanoramaIndex(idx, 'smooth');
          }
          updatePageIndicator();
        } else if (spreadOn) {
          if (shiftSwitch.checked) idx = Math.max(0, idx - 2);
          else if (idx === 1) idx = 0;
          else if (idx > 1) idx -= 2;
          renderViewer();
        } else {
          if (idx > 0) {
            idx--;
            renderViewer();
          }
        }
      }

      document.getElementById('nextBtn').addEventListener('click', function (e) { e.stopPropagation(); next(); });
      document.getElementById('prevBtn').addEventListener('click', function (e) { e.stopPropagation(); prev(); });
      document.getElementById('closeBtn').addEventListener('click', function (e) { e.stopPropagation(); closeViewer(); });
      document.getElementById('firstBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        if (panoramaSwitch.checked) {
          // パノラマならスクロールで先頭に飛ばしてインジケータを更新
          idx = 0;
          scrollToPanoramaIndex(0, 'smooth');
          updatePageIndicator();
        } else {
          // 単ページ／見開きは既存のレンダーで対応
          idx = 0;
          renderViewer();
        }
      });


      pageSlider.addEventListener('input', function () {
        if (!images.length) return;
        pageSliderInteracting = true;
        const selectedIndex = Math.max(0, Math.min(images.length - 1, Number(pageSlider.value) || 0));
        if (panoramaSwitch.checked) {
          idx = selectedIndex;
          updatePageIndicator(false);
          // スライダーの動きに合わせてページを即時移動する
          scrollToPanoramaIndex(idx, 'auto');
        } else {
          idx = spreadSwitch.checked ? getSpreadPairStart(selectedIndex) : selectedIndex;
          renderViewer(false);
        }
      });
      pageSlider.addEventListener('change', function () {
        pageSliderInteracting = false;
        pageSlider.value = String(images.length ? Math.max(0, Math.min(images.length - 1, idx)) : 0);
        saveArchiveProgress();
      });
      // keyboard
      document.addEventListener('keydown', function (e) {
        if (viewerOverlay.getAttribute('aria-hidden') === 'true') return;
        if (e.key === 'ArrowRight') next();
        else if (e.key === 'ArrowLeft') prev();
        else if (e.key === 'Escape') closeViewer();
      });

      // touch swipe
      let touchStartX = null;
      viewerOverlay.addEventListener('touchstart', function (e) {
        // タッチ開始の X を記録（パノラマ時も記録しておく）
        touchStartX = e.changedTouches[0].clientX;
      }, { passive: true });

      viewerOverlay.addEventListener('touchend', function (e) {
        if (touchStartX == null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;

        // ★ パノラマモードなら「スワイプでの prev/next を行わない」
        //    （パノラマは自由スクロールが優先）
        if (panoramaSwitch.checked) {
          touchStartX = null;
          // ※ スクロールで idx は scroll イベントで更新されるのでここでは何もしない
          return;
        }

        // パノラマでなければ（通常の単ページ／見開き）スワイプでページ操作
        if (Math.abs(dx) > 40) {
          if (dirRight.checked) {
            // 右開き: スワイプ左で prev、右で next （既存の仕様を維持）
            if (dx < 0) prev();
            else next();
          } else {
            // 左開き
            if (dx < 0) next();
            else prev();
          }
        }

        touchStartX = null;
      }, { passive: true });

      // Menu panel
      menuBtn.addEventListener('click', function (e) { e.stopPropagation(); openMenu(); });
      function openMenu() { readerZipNameSetting.hidden = activeSource !== 'url'; readerZipNameInput.value = urlTitleInput.value; menuPanel.style.display = 'block'; menuPanel.setAttribute('aria-hidden', 'false'); }
      function closeMenu() { menuPanel.style.display = 'none'; menuPanel.setAttribute('aria-hidden', 'true'); }
      menuCloseBtn.addEventListener('click', function (e) { e.stopPropagation(); closeMenu(); });
      menuDownloadBtn.addEventListener('click', async function (e) {
        e.stopPropagation();
        if (activeSource !== 'url' || !images.length) return;
        menuDownloadBtn.disabled = true;
        menuDownloadBtn.textContent = '作成中...';
        closeMenu();
        showReaderStatus(`ZIP 0/${images.length}`);
        try {
          const zip = new JSZip();
          for (let index = 0; index < images.length; index++) {
            const response = await fetch(images[index], { mode: 'cors' });
            if (!response.ok) throw new Error(`画像取得失敗: HTTP ${response.status}`);
            const blob = await response.blob();
            const extension = (() => {
              try { return new URL(images[index]).pathname.match(/\.([a-z0-9]+)$/i)?.[1] || 'jpg'; }
              catch (error) { return 'jpg'; }
            })();
            zip.file(`${String(index + 1).padStart(4, '0')}.${extension}`, blob);
            showReaderStatus(`ZIP ${index + 1}/${images.length}`);
          }
          const content = await zip.generateAsync({ type: 'blob' }, function (metadata) {
            showReaderStatus(`圧縮 ${Math.floor(metadata.percent)}%`);
          });
          const safeName = (urlComicTitle || 'comic').replace(/[\\/:*?"<>|]/g, '_');
          saveAs(content, `${safeName}.zip`);
        } catch (error) {
          console.error('ZIP保存エラー:', error);
          document.getElementById('errorContainer').textContent = error.message || 'ZIPを作成できませんでした。';
        } finally {
          hideReaderStatus();
          menuDownloadBtn.disabled = false;
          menuDownloadBtn.textContent = 'ZIP保存';
        }
      });

      // clicking outside menu closes it
      document.addEventListener('click', function (e) {
        if (menuPanel.style.display === 'block') {
          const rect = menuPanel.getBoundingClientRect();
          if (!(e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom)) {
            closeMenu();
          }
        }
      });
      menuPanel.addEventListener('click', function (e) { e.stopPropagation(); });

      // re-render when spread/direction change
      spreadSwitch.addEventListener('change', function () {
        if (spreadSwitch.checked) idx = getSpreadPairStart(idx);
        panoramaSwitch.checked = false;
        renderViewer();
      });
      shiftSwitch.addEventListener('change', function () {
        if (spreadSwitch.checked) idx = getSpreadPairStart(idx);
        renderViewer();
      });
      panoramaSwitch.addEventListener('change', function () {
        if (panoramaSwitch.checked) {
          spreadSwitch.checked = false;
        }
        renderViewer();
      });
      dirRight.addEventListener('change', function () { renderViewer(); });
      dirLeft.addEventListener('change', function () { renderViewer(); });

      // utility
      function scrollToPanoramaIndex(pageIndex, behavior) {
        const target = panoramaWrapper.querySelector(`img[data-index="${pageIndex}"]`);
        if (!target) return;
        if (panoramaScrollTimeout) {
          clearTimeout(panoramaScrollTimeout);
          panoramaScrollTimeout = null;
        }
        if (panoramaProgrammaticUnlockTimer) clearTimeout(panoramaProgrammaticUnlockTimer);
        isProgrammaticScroll = true;
        target.scrollIntoView({ behavior: behavior, inline: 'center' });
        panoramaProgrammaticUnlockTimer = setTimeout(function () {
          isProgrammaticScroll = false;
          panoramaProgrammaticUnlockTimer = null;
        }, behavior === 'smooth' ? 500 : 180);
      }


    });
  </script>

</body>
